    <g stroke="url(#g)" stroke-width="2.6" stroke-linecap="round" opacity=".75">

<script>
  window.__timelines = window.__timelines || {};
  const T = 5.2, tl = gsap.timeline({ paused: true });
  gsap.set(".d", { opacity: 0, scale: 0.94 }); gsap.set(".e", { strokeDasharray: 1, strokeDashoffset: 1 });
  gsap.set("#b", { borderColor: "#d5d8e0", color: "#3a3e4a" });
  tl.to("#a", { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.3);

  tl.to("#b", { borderColor: "#2f54ff", color: "#1f3ee6", duration: 0.35 }, 3.0);
  tl.to(".d", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, T - 0.6);
  tl.to(".e", { opacity: 0, duration: 0.5 }, T - 0.6);
  tl.to("#b", { borderColor: "#d5d8e0", color: "#3a3e4a", duration: 0.5 }, T - 0.6);
  tl.to({}, { duration: 0.01 }, T);
  window.__timelines["architecture"] = tl;
