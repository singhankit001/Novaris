name: Refresh Tiered Repo Catalog

on:
  workflow_dispatch:
    inputs:
      force_all_time:
        description: 'Force refresh all-time tier'
        required: false
        type: boolean
        default: false
  schedule:
    # Weekly refresh (weekly, monthly, 6-month, yearly tiers)
    - cron: "0 3 * * 1" # Every Monday at 3 AM UTC
    # All-time refresh (every 5 years - manual trigger recommended)
    # Note: For practical purposes, all-time tier can be triggered manually
    # or updated once per year if needed

permissions:
  contents: write

# Serialize refreshes; a queued run waits instead of cancelling one that is mid-fetch.
concurrency:
  group: refresh-repo-catalog
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Catalog with Trending Algorithm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Catalog tests
        run: node --test tests/catalog/refresh.test.mjs

      - name: Check if all-time tier needs refresh
        id: check_alltime
        env:
          FORCE_ALL_TIME: ${{ github.event.inputs.force_all_time }}
        run: |
          # Source of truth is public/data/catalog-meta.json (no git history dependency).
          # Missing file or missing/invalid timestamp means refresh.
          LAST=""
          if [ -f public/data/catalog-meta.json ]; then
            LAST=$(jq -r '.allTimeRefreshedAt // empty' public/data/catalog-meta.json)
          fi
          LAST_EPOCH=""
          if [ -n "$LAST" ]; then
            LAST_EPOCH=$(date -d "$LAST" +%s 2>/dev/null || true)
          fi

          if [ "$FORCE_ALL_TIME" = "true" ]; then
            REASON="forced"
          elif [ -z "$LAST_EPOCH" ]; then
            REASON="no valid allTimeRefreshedAt in catalog-meta.json"
          else
            DAYS_SINCE=$(( ($(date +%s) - LAST_EPOCH) / 86400 ))
            if [ "$DAYS_SINCE" -gt 1825 ]; then
              REASON="last refresh $DAYS_SINCE days ago"
            else
              echo "refresh_alltime=false" >> "$GITHUB_OUTPUT"
              echo "All-time tier skipped (last refresh: $DAYS_SINCE days ago, next in $((1825 - DAYS_SINCE)) days)"
              exit 0
            fi
          fi
          echo "refresh_alltime=true" >> "$GITHUB_OUTPUT"
          echo "All-time tier will be refreshed ($REASON)"

      - name: Refresh catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_ALLTIME: ${{ steps.check_alltime.outputs.refresh_alltime }}
        run: |
          # The script validates schema and per-tier counts, and only replaces
          # the dataset (atomically) on success. Any failure fails this step.
          if [ "$REFRESH_ALLTIME" = "true" ]; then
            node scripts/fetch-trending-repos.mjs
          else
            node scripts/fetch-trending-repos.mjs --skip-all-time
          fi

      - name: Commit refreshed dataset
        env:
          REFRESH_ALLTIME: ${{ steps.check_alltime.outputs.refresh_alltime }}
        run: |
          FILES="public/data/top-repos.json public/data/catalog-meta.json"
          git add $FILES
          if git diff --cached --quiet -- $FILES; then
            echo "No dataset changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$REFRESH_ALLTIME" = "true" ]; then
            git commit -m "chore(data): refresh all tiers including all-time tier"
          else
            git commit -m "chore(data): refresh trending tiers (weekly, monthly, 6-month, yearly)"
          fi

          # Rebase onto anything pushed while we were fetching; a conflict fails the job loudly.
          BRANCH="${GITHUB_REF_NAME}"
          if ! git pull --rebase origin "$BRANCH"; then
            echo "::error::Rebase onto origin/$BRANCH conflicted; aborting without pushing."
            git rebase --abort || true
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
        # NOTE: Sitemap is refreshed automatically on the next Vercel deployment after this commit.
